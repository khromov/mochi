<!doctype html>
<html>
  <head>
    {{mochi.dog}}
    <meta charset="utf-8" />
    {{mochi.head}}
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      // Apply persisted theme before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var s = localStorage.getItem('mochi-theme');
          if (s === 'light' || s === 'dark') {
            document.documentElement.setAttribute('data-theme', s);
          }
        } catch (e) {
          /* storage blocked */
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: light dark;

        --bg: #f5f3ec;
        --surface: #fffdf8;
        --surface-muted: #faf8f1;
        --border: #e8e4d8;
        --border-strong: #c9cfc5;
        --text: #1f2a24;
        --text-muted: #4a5751;
        --text-subtle: #6e756d;
        --accent: #4a7c59;
        --accent-hover: #3d6b4a;
        --accent-text: #fff;
        --accent-soft: #e0ebe1;
        --accent-soft-text: #2f5b3f;
        --focus-ring: 0 0 0 3px rgba(74, 124, 89, 0.18);
        --shadow-sm: 0 1px 3px rgba(47, 61, 51, 0.05);
        --shadow-md: 0 4px 16px rgba(47, 61, 51, 0.06), 0 1px 3px rgba(47, 61, 51, 0.04);
        --shadow-lg: 0 10px 32px rgba(47, 61, 51, 0.1), 0 2px 8px rgba(47, 61, 51, 0.05);
        --radius-sm: 6px;
        --radius-md: 8px;
        --radius-lg: 16px;

        --badge-default-bg: var(--surface-muted);
        --badge-default-text: var(--text-muted);
        --badge-success-bg: var(--accent-soft);
        --badge-success-text: var(--accent-soft-text);
        --badge-warning-bg: #f5ecd7;
        --badge-warning-text: #7a5a20;
        --badge-info-bg: #e3ece0;
        --badge-info-text: #2f5235;
        --badge-danger-bg: #f4dcd6;
        --badge-danger-text: #7a2e20;
        --badge-tip-bg: #dde7ec;
        --badge-tip-text: #2c4d61;

        --code-bg: #10140f;
        --code-chrome-bg: #18201b;
        --code-chrome-border: #0f1511;
        --code-muted: rgba(232, 230, 221, 0.58);
        --code-text: #e8e6dd;
        --code-accent: #a7c9a8;
        --code-accent-underline: #8fb097;

        --font-sans: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-serif: 'Fraunces Variable', Georgia, 'Times New Roman', serif;
        --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
      }

      /* Dark-mode tokens. Applied via:
         (a) `prefers-color-scheme: dark` when no explicit user choice is stored
         (b) `html[data-theme="dark"]` when the user has opted in explicitly
         `html[data-theme="light"]` below re-asserts light tokens and beats the media
         query via higher specificity, so it works on dark-preferring systems too. */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #171914;
          --surface: #1f221c;
          --surface-muted: #1a1d17;
          --border: #2e3228;
          --border-strong: #434836;
          --text: #e8e6dd;
          --text-muted: #a8ada0;
          --text-subtle: #8e9488;
          --accent: #8ab79a;
          --accent-hover: #a2cfb1;
          --accent-text: #1a1d17;
          --accent-soft: #2a3a2f;
          --accent-soft-text: #c7e0cd;
          --focus-ring: 0 0 0 3px rgba(138, 183, 154, 0.24);

          --shadow-sm: inset 0 0 0 1px rgba(255, 253, 240, 0.02);
          --shadow-md: inset 0 0 0 1px rgba(255, 253, 240, 0.03), 0 1px 2px rgba(0, 0, 0, 0.3);
          --shadow-lg: inset 0 0 0 1px rgba(255, 253, 240, 0.04), 0 6px 18px rgba(0, 0, 0, 0.35);

          --badge-default-bg: #24281f;
          --badge-default-text: #b5baa9;
          --badge-success-bg: #2a3a2f;
          --badge-success-text: #c7e0cd;
          --badge-warning-bg: #2f281a;
          --badge-warning-text: #d5b982;
          --badge-info-bg: #233028;
          --badge-info-text: #b8d5be;
          --badge-danger-bg: #351f1a;
          --badge-danger-text: #e9a89a;
          --badge-tip-bg: #1e2b33;
          --badge-tip-text: #b6cdd8;

          --code-bg: #10140f;
          --code-chrome-bg: #0b0e0a;
          --code-chrome-border: #000000;
        }
      }

      /* Explicit dark choice — wins regardless of system preference. */
      :root[data-theme='dark'] {
        --bg: #171914;
        --surface: #1f221c;
        --surface-muted: #1a1d17;
        --border: #2e3228;
        --border-strong: #434836;
        --text: #e8e6dd;
        --text-muted: #a8ada0;
        --text-subtle: #8e9488;
        --accent: #8ab79a;
        --accent-hover: #a2cfb1;
        --accent-text: #1a1d17;
        --accent-soft: #2a3a2f;
        --accent-soft-text: #c7e0cd;
        --focus-ring: 0 0 0 3px rgba(138, 183, 154, 0.24);

        --shadow-sm: inset 0 0 0 1px rgba(255, 253, 240, 0.02);
        --shadow-md: inset 0 0 0 1px rgba(255, 253, 240, 0.03), 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-lg: inset 0 0 0 1px rgba(255, 253, 240, 0.04), 0 6px 18px rgba(0, 0, 0, 0.35);

        --badge-default-bg: #24281f;
        --badge-default-text: #b5baa9;
        --badge-success-bg: #2a3a2f;
        --badge-success-text: #c7e0cd;
        --badge-warning-bg: #2f281a;
        --badge-warning-text: #d5b982;
        --badge-info-bg: #233028;
        --badge-info-text: #b8d5be;
        --badge-danger-bg: #351f1a;
        --badge-danger-text: #e9a89a;
        --badge-tip-bg: #1e2b33;
        --badge-tip-text: #b6cdd8;

        --code-bg: #10140f;
        --code-chrome-bg: #0b0e0a;
        --code-chrome-border: #000000;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background: var(--bg);
        font-family: var(--font-sans);
        min-height: 100vh;
        color: var(--text);
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      /* Shared code-block markup. Produced by `highlightCode()` in src/lib/highlightCode.ts
         (used by both mdsvex doc pages and the demo source viewer), so the visual
         treatment lives globally rather than inside any one prose surface. */
      pre {
        background: var(--code-bg);
        color: var(--code-text);
        padding: 0.9rem 1rem;
        border-radius: var(--radius-md);
        overflow-x: auto;
        margin: 0 0 0.75rem;
        font-size: 0.95rem;
        line-height: 1.5;
      }

      .code-block {
        position: relative;
      }

      .code-copy {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.3rem;
        min-width: 1.75rem;
        min-height: 1.75rem;
        font-size: 0.7rem;
        font-weight: 600;
        font-family: var(--font-sans);
        color: var(--accent);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition:
          background 0.12s ease,
          border-color 0.12s ease,
          color 0.12s ease;
        z-index: 2;
      }

      .code-copy:hover {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent-hover);
      }

      .code-copy:active {
        background: var(--accent);
        color: var(--accent-text);
        border-color: var(--accent-hover);
      }

      pre code {
        display: block;
        padding: 0;
        background: transparent;
        border: 0;
        border-radius: 0;
        color: inherit;
        font-size: inherit;
      }

      .hero {
        position: relative;
        background-color: #2b3d33;
        background-image:
          url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"),
          linear-gradient(135deg, #2b3d33 0%, #4a7c59 100%);
        background-size:
          240px 240px,
          auto;
        background-blend-mode: soft-light, normal;
        text-align: center;
        overflow: hidden;
      }

      .gh-corner {
        position: absolute;
        top: 0;
        right: 0;
        z-index: 9999;
        border: 0;
        color: #fff;
      }
      .gh-corner svg {
        width: 60px;
        height: 60px;
        fill: #151513;
        color: #fff;
      }
      .gh-corner .octo-arm {
        transform-origin: 130px 106px;
      }
      /* Hide the fixed corner on mobile; a corner is rendered inside the mobile menu instead (MobileNav.svelte). */
      @media (max-width: 768px) {
        .gh-corner {
          display: none;
        }
      }
      .gh-corner:hover .octo-arm {
        animation: octocat-wave 560ms ease-in-out;
      }
      @keyframes octocat-wave {
        0%,
        100% {
          transform: rotate(0);
        }
        20%,
        60% {
          transform: rotate(-25deg);
        }
        40%,
        80% {
          transform: rotate(10deg);
        }
      }
      @media (max-width: 500px) {
        .gh-corner:hover .octo-arm {
          animation: none;
        }
        .gh-corner .octo-arm {
          animation: octocat-wave 560ms ease-in-out;
        }
      }

      /* Invert the octocat in dark mode (same two triggers as the token blocks above). */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) .gh-corner svg {
          fill: #fff;
          color: #151513;
        }
      }
      :root[data-theme='dark'] .gh-corner svg {
        fill: #fff;
        color: #151513;
      }
    </style>
    {{mochi.css}}
  </head>
  <body>
    {{mochi.body}}
    <a href="https://github.com/khromov/mochi" target="_blank" rel="noopener noreferrer" class="gh-corner" aria-label="View source on GitHub">
      <svg width="80" height="80" viewBox="0 0 250 250" aria-hidden="true">
        <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
        <path
          d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.9,78.5 120.9,78.5 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2"
          fill="currentColor"
          class="octo-arm"
        ></path>
        <path
          d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.8 141.5,141.9 141.8,141.8 Z"
          fill="currentColor"
          class="octo-body"
        ></path>
      </svg>
    </a>
    {{mochi.script}} {{mochi.analytics}}
  </body>
</html>
