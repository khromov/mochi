<!doctype html>
<html>
  <head>
    {{mochi.dog}}
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      // Apply persisted theme before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var s = localStorage.getItem('mochi-theme');
          if (s === 'light' || s === 'dark') {
            document.documentElement.setAttribute('data-theme', s);
          }
        } catch (e) {
          /* storage blocked */
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: light dark;

        --bg: #f5f3ec;
        --surface: #fffdf8;
        --surface-muted: #faf8f1;
        --border: #e8e4d8;
        --border-strong: #c9cfc5;
        --text: #1f2a24;
        --text-muted: #4a5751;
        --text-subtle: #6e756d;
        --accent: #4a7c59;
        --accent-hover: #3d6b4a;
        --accent-text: #fff;
        --accent-soft: #e0ebe1;
        --accent-soft-text: #2f5b3f;
        --focus-ring: 0 0 0 3px rgba(74, 124, 89, 0.18);
        --shadow-sm: 0 1px 3px rgba(47, 61, 51, 0.05);
        --shadow-md: 0 4px 16px rgba(47, 61, 51, 0.06), 0 1px 3px rgba(47, 61, 51, 0.04);
        --shadow-lg: 0 10px 32px rgba(47, 61, 51, 0.1), 0 2px 8px rgba(47, 61, 51, 0.05);
        --radius-sm: 6px;
        --radius-md: 8px;
        --radius-lg: 16px;

        --badge-default-bg: var(--surface-muted);
        --badge-default-text: var(--text-muted);
        --badge-success-bg: var(--accent-soft);
        --badge-success-text: var(--accent-soft-text);
        --badge-warning-bg: #f5ecd7;
        --badge-warning-text: #7a5a20;
        --badge-info-bg: #e3ece0;
        --badge-info-text: #2f5235;
        --badge-danger-bg: #f4dcd6;
        --badge-danger-text: #7a2e20;
        --badge-tip-bg: #dde7ec;
        --badge-tip-text: #2c4d61;

        --code-bg: #1f2a24;
        --code-chrome-bg: #18201b;
        --code-chrome-border: #0f1511;
        --code-muted: rgba(232, 230, 221, 0.58);
        --code-text: #e8e6dd;
        --code-accent: #a7c9a8;
        --code-accent-underline: #8fb097;

        --font-sans: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-serif: 'Fraunces Variable', Georgia, 'Times New Roman', serif;
        --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
      }

      /* Dark-mode tokens. Applied via:
         (a) `prefers-color-scheme: dark` when no explicit user choice is stored
         (b) `html[data-theme="dark"]` when the user has opted in explicitly
         `html[data-theme="light"]` below re-asserts light tokens and beats the media
         query via higher specificity, so it works on dark-preferring systems too. */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #171914;
          --surface: #1f221c;
          --surface-muted: #1a1d17;
          --border: #2e3228;
          --border-strong: #434836;
          --text: #e8e6dd;
          --text-muted: #a8ada0;
          --text-subtle: #8e9488;
          --accent: #8ab79a;
          --accent-hover: #a2cfb1;
          --accent-text: #1a1d17;
          --accent-soft: #2a3a2f;
          --accent-soft-text: #c7e0cd;
          --focus-ring: 0 0 0 3px rgba(138, 183, 154, 0.24);

          --shadow-sm: inset 0 0 0 1px rgba(255, 253, 240, 0.02);
          --shadow-md: inset 0 0 0 1px rgba(255, 253, 240, 0.03), 0 1px 2px rgba(0, 0, 0, 0.3);
          --shadow-lg: inset 0 0 0 1px rgba(255, 253, 240, 0.04), 0 6px 18px rgba(0, 0, 0, 0.35);

          --badge-default-bg: #24281f;
          --badge-default-text: #b5baa9;
          --badge-success-bg: #2a3a2f;
          --badge-success-text: #c7e0cd;
          --badge-warning-bg: #2f281a;
          --badge-warning-text: #d5b982;
          --badge-info-bg: #233028;
          --badge-info-text: #b8d5be;
          --badge-danger-bg: #351f1a;
          --badge-danger-text: #e9a89a;
          --badge-tip-bg: #1e2b33;
          --badge-tip-text: #b6cdd8;

          --code-bg: #10140f;
          --code-chrome-bg: #0b0e0a;
          --code-chrome-border: #000000;
        }
      }

      /* Explicit dark choice — wins regardless of system preference. */
      :root[data-theme='dark'] {
        --bg: #171914;
        --surface: #1f221c;
        --surface-muted: #1a1d17;
        --border: #2e3228;
        --border-strong: #434836;
        --text: #e8e6dd;
        --text-muted: #a8ada0;
        --text-subtle: #72786c;
        --accent: #8ab79a;
        --accent-hover: #a2cfb1;
        --accent-text: #1a1d17;
        --accent-soft: #2a3a2f;
        --accent-soft-text: #c7e0cd;
        --focus-ring: 0 0 0 3px rgba(138, 183, 154, 0.24);

        --shadow-sm: inset 0 0 0 1px rgba(255, 253, 240, 0.02);
        --shadow-md: inset 0 0 0 1px rgba(255, 253, 240, 0.03), 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-lg: inset 0 0 0 1px rgba(255, 253, 240, 0.04), 0 6px 18px rgba(0, 0, 0, 0.35);

        --badge-default-bg: #24281f;
        --badge-default-text: #b5baa9;
        --badge-success-bg: #2a3a2f;
        --badge-success-text: #c7e0cd;
        --badge-warning-bg: #2f281a;
        --badge-warning-text: #d5b982;
        --badge-info-bg: #233028;
        --badge-info-text: #b8d5be;
        --badge-danger-bg: #351f1a;
        --badge-danger-text: #e9a89a;
        --badge-tip-bg: #1e2b33;
        --badge-tip-text: #b6cdd8;

        --code-bg: #10140f;
        --code-chrome-bg: #0b0e0a;
        --code-chrome-border: #000000;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background: var(--bg);
        font-family: var(--font-sans);
        min-height: 100vh;
        color: var(--text);
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      /* Warm syntax theme. Used by <pre><code class="hljs"> output from svelte-highlight
         (both CodeViewer.svelte tabs and Docs.svelte markdown blocks). */
      .hljs {
        color: var(--code-text);
      }
      .hljs-comment,
      .hljs-quote {
        color: #72786c;
        font-style: italic;
      }
      .hljs-keyword,
      .hljs-selector-tag,
      .hljs-literal,
      .hljs-type {
        color: #a7c9a8;
      }
      .hljs-string,
      .hljs-regexp,
      .hljs-addition {
        color: #d5b982;
      }
      .hljs-number,
      .hljs-meta {
        color: #e9a89a;
      }
      .hljs-built_in,
      .hljs-class .hljs-title,
      .hljs-title.class_,
      .hljs-title.class_.inherited__,
      .hljs-symbol {
        color: #c7e0cd;
      }
      .hljs-function,
      .hljs-title.function_,
      .hljs-title {
        color: #e8e6dd;
      }
      .hljs-attr,
      .hljs-variable,
      .hljs-template-variable {
        color: #b8d5be;
      }
      .hljs-tag,
      .hljs-name,
      .hljs-selector-id,
      .hljs-selector-class {
        color: #8fb097;
      }
      .hljs-attribute,
      .hljs-property {
        color: #b8d5be;
      }
      .hljs-params,
      .hljs-punctuation {
        color: var(--code-text);
      }
      .hljs-deletion {
        color: #e9a89a;
      }
      .hljs-emphasis {
        font-style: italic;
      }
      .hljs-strong {
        font-weight: 700;
      }

      /* Shared code-block markup. Produced by `highlightCode()` in src/lib/highlightCode.ts
         (used by both mdsvex doc pages and the demo source viewer), so the visual
         treatment lives globally rather than inside any one prose surface. */
      pre {
        background: var(--code-bg);
        color: var(--code-text);
        padding: 0.9rem 1rem;
        border-radius: var(--radius-md);
        overflow-x: auto;
        margin: 0 0 0.75rem;
        font-size: 0.95rem;
        line-height: 1.5;
      }

      .code-block {
        position: relative;
      }

      .code-copy {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.3rem;
        min-width: 1.75rem;
        min-height: 1.75rem;
        font-size: 0.7rem;
        font-weight: 600;
        font-family: var(--font-sans);
        color: var(--accent);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition:
          background 0.12s ease,
          border-color 0.12s ease,
          color 0.12s ease;
        z-index: 2;
      }

      .code-copy:hover {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent-hover);
      }

      .code-copy:active {
        background: var(--accent);
        color: var(--accent-text);
        border-color: var(--accent-hover);
      }

      pre code,
      pre code.hljs {
        display: block;
        padding: 0;
        background: transparent;
        border: 0;
        border-radius: 0;
        color: inherit;
        font-size: inherit;
      }

      .hero {
        position: relative;
        background-color: #2b3d33;
        background-image:
          url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"),
          linear-gradient(135deg, #2b3d33 0%, #4a7c59 100%);
        background-size:
          240px 240px,
          auto;
        background-blend-mode: soft-light, normal;
        text-align: center;
        overflow: hidden;
      }
    </style>
    {{mochi.head}} {{mochi.css}}
  </head>
  <body>
    {{mochi.body}} {{mochi.script}}
    <script defer src="https://u.khromov.se/u.js" data-website-id="8dceb8f5-6533-4c03-9cd6-1ce74accd63a"></script>
  </body>
</html>
