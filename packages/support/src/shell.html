<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    {{mochi.head}}
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      // The newsletter embed is iframed by mochi.fast, whose theme is a choice
      // stored in *its* localStorage — unreadable across origins. The host puts
      // that choice in the iframe URL instead, and applying it before paint is
      // what keeps a dark blog from flashing a white widget. Later toggles arrive
      // as postMessage; see src/newsletter/SidechainGuest.svelte.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: light dark;

        --bg: #f5f3ec;
        --surface: #fffdf8;
        --surface-muted: #faf8f1;
        --border: #e8e4d8;
        --text: #1f2a24;
        --text-muted: #4a5751;
        --text-subtle: #6e756d;
        --accent: #4a7c59;
        --accent-hover: #3d6b4a;
        --accent-text: #fff;
        --accent-soft: #e0ebe1;
        --accent-soft-text: #2f5b3f;
        --badge-danger-text: #7a2e20;
        --shadow-md: 0 4px 16px rgba(47, 61, 51, 0.06), 0 1px 3px rgba(47, 61, 51, 0.04);
        --radius-md: 8px;
        --radius-lg: 16px;

        --font-sans: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-serif: 'Fraunces Variable', Georgia, 'Times New Roman', serif;
      }

      /* Same token values as packages/site's shell, so an embedded widget is
         indistinguishable from the host page around it. Applied for a dark system
         preference unless light was explicitly asked for, and for an explicit dark
         choice regardless of the system. */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #171914;
          --surface: #1f221c;
          --surface-muted: #1a1d17;
          --border: #2e3228;
          --text: #e8e6dd;
          --text-muted: #a8ada0;
          --text-subtle: #8e9488;
          --accent: #8ab79a;
          --accent-hover: #a2cfb1;
          --accent-text: #1a1d17;
          --accent-soft: #2a3a2f;
          --accent-soft-text: #c7e0cd;
          --badge-danger-text: #e9a89a;
          --shadow-md: inset 0 0 0 1px rgba(255, 253, 240, 0.03), 0 1px 2px rgba(0, 0, 0, 0.3);
        }
      }

      :root[data-theme='dark'] {
        --bg: #171914;
        --surface: #1f221c;
        --surface-muted: #1a1d17;
        --border: #2e3228;
        --text: #e8e6dd;
        --text-muted: #a8ada0;
        --text-subtle: #8e9488;
        --accent: #8ab79a;
        --accent-hover: #a2cfb1;
        --accent-text: #1a1d17;
        --accent-soft: #2a3a2f;
        --accent-soft-text: #c7e0cd;
        --badge-danger-text: #e9a89a;
        --shadow-md: inset 0 0 0 1px rgba(255, 253, 240, 0.03), 0 1px 2px rgba(0, 0, 0, 0.3);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background: var(--bg);
        font-family: var(--font-sans);
        min-height: 100vh;
        color: var(--text);
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .hero-minimal {
        position: relative;
        background-color: #2b3d33;
        background-image:
          url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"),
          linear-gradient(135deg, #2b3d33 0%, #4a7c59 100%);
        background-size:
          240px 240px,
          auto;
        background-blend-mode: soft-light, normal;
        text-align: center;
        overflow: hidden;
      }
    </style>
    {{mochi.css}}
  </head>
  <body>
    {{mochi.body}} {{mochi.script}} {{mochi.analytics}}
  </body>
</html>
