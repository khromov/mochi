<!doctype html>
<!-- Palette lifted from packages/site/src/shell.html (there is no shared token
     package), reduced to the light-mode tokens this one-page site actually uses.
     The site's dark-mode blocks, theme-toggle script, and code-block styles are
     deliberately absent — support renders no highlighted code and has no theme
     switcher, so light mode is the whole story here. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    {{mochi.head}}
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: light;

        --bg: #f5f3ec;
        --surface: #fffdf8;
        --surface-muted: #faf8f1;
        --border: #e8e4d8;
        --text: #1f2a24;
        --text-muted: #4a5751;
        --text-subtle: #6e756d;
        --accent: #4a7c59;
        --accent-hover: #3d6b4a;
        --accent-text: #fff;
        --accent-soft: #e0ebe1;
        --accent-soft-text: #2f5b3f;
        --badge-danger-text: #7a2e20;
        --shadow-md: 0 4px 16px rgba(47, 61, 51, 0.06), 0 1px 3px rgba(47, 61, 51, 0.04);
        --radius-md: 8px;
        --radius-lg: 16px;

        --font-sans: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-serif: 'Fraunces Variable', Georgia, 'Times New Roman', serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background: var(--bg);
        font-family: var(--font-sans);
        min-height: 100vh;
        color: var(--text);
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .hero-minimal {
        position: relative;
        background-color: #2b3d33;
        background-image:
          url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"),
          linear-gradient(135deg, #2b3d33 0%, #4a7c59 100%);
        background-size:
          240px 240px,
          auto;
        background-blend-mode: soft-light, normal;
        text-align: center;
        overflow: hidden;
      }
    </style>
    {{mochi.css}}
  </head>
  <body>
    {{mochi.body}} {{mochi.script}}
  </body>
</html>
