<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    {{mochi.head}}
    <script>
      (function () {
        try {
          var s = localStorage.getItem('mochi-theme');
          if (s === 'light' || s === 'dark') {
            document.documentElement.setAttribute('data-theme', s);
          }
        } catch (e) {
          /* storage blocked */
        }
      })();
    </script>
    <style>
      :root {
        --font-serif: 'Fraunces Variable', Georgia, 'Times New Roman', serif;

        /* HN demo palette — pinned to the cream/black HN look (the clone
           deliberately mirrors news.ycombinator.com, which is always bright). */
        --hn-bg: #f6f6ef;
        --hn-text: #000;
        --hn-text-meta: #828282;
        --hn-orange: #ff6600;
        --hn-border: #e0e0e0;
        --hn-link: #000;
        --hn-link-visited: #828282;
        --hn-banner-bg: linear-gradient(135deg, #2b3d33 0%, #4a7c59 100%);
        --hn-banner-text: #fff;
        --hn-banner-link: #f4f1e8;
        --hn-skeleton-from: #e8e8e0;
        --hn-skeleton-to: #f0f0e8;
        --hn-font: Verdana, Geneva, sans-serif;

        /* Admin demo palette — green accent over warm cream/charcoal,
           lifted from the docs-site token system so the standalone admin
           keeps the same visual identity. */
        --admin-bg: #f5f3ec;
        --admin-surface: #fffdf8;
        --admin-surface-muted: #faf8f1;
        --admin-border: #e8e4d8;
        --admin-border-strong: #c9cfc5;
        --admin-text: #1f2a24;
        --admin-text-muted: #4a5751;
        --admin-text-subtle: #8a9189;
        --admin-accent: #4a7c59;
        --admin-accent-hover: #3d6b4a;
        --admin-accent-soft: #e0ebe1;
        --admin-accent-soft-text: #2f5b3f;
        --admin-radius-sm: 6px;
        --admin-radius-md: 8px;
        --admin-radius-lg: 16px;
        --admin-shadow-sm: 0 1px 3px rgba(47, 61, 51, 0.05);
        --admin-shadow-md: 0 4px 16px rgba(47, 61, 51, 0.06), 0 1px 3px rgba(47, 61, 51, 0.04);

        --admin-badge-default-bg: var(--admin-surface-muted);
        --admin-badge-default-text: var(--admin-text-muted);
        --admin-badge-success-bg: var(--admin-accent-soft);
        --admin-badge-success-text: var(--admin-accent-soft-text);
        --admin-badge-warning-bg: #f5ecd7;
        --admin-badge-warning-text: #7a5a20;
        --admin-badge-info-bg: #e3ece0;
        --admin-badge-info-text: #2f5235;
        --admin-badge-danger-bg: #f4dcd6;
        --admin-badge-danger-text: #7a2e20;

        --admin-font-sans: 'Public Sans', system-ui, -apple-system, sans-serif;
        --admin-font-serif: var(--font-serif);
        --admin-font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
      }

      /* Dark-mode admin tokens. Applied via:
         (a) `prefers-color-scheme: dark` when no explicit user choice is stored
         (b) `:root[data-theme='dark']` when the user toggles dark explicitly
         The `:not([data-theme='light'])` exclusion lets users force light mode
         on dark-preferring systems. HN tokens are unaffected (HN intentionally
         stays bright). */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --admin-bg: #171914;
          --admin-surface: #1f221c;
          --admin-surface-muted: #1a1d17;
          --admin-border: #2e3228;
          --admin-border-strong: #434836;
          --admin-text: #e8e6dd;
          --admin-text-muted: #a8ada0;
          --admin-text-subtle: #72786c;
          --admin-accent: #8ab79a;
          --admin-accent-hover: #a2cfb1;
          --admin-accent-soft: #2a3a2f;
          --admin-accent-soft-text: #c7e0cd;
          --admin-shadow-sm: inset 0 0 0 1px rgba(255, 253, 240, 0.02);
          --admin-shadow-md: inset 0 0 0 1px rgba(255, 253, 240, 0.03), 0 1px 2px rgba(0, 0, 0, 0.3);

          --admin-badge-default-bg: #24281f;
          --admin-badge-default-text: #b5baa9;
          --admin-badge-success-bg: #2a3a2f;
          --admin-badge-success-text: #c7e0cd;
          --admin-badge-warning-bg: #2f281a;
          --admin-badge-warning-text: #d5b982;
          --admin-badge-info-bg: #233028;
          --admin-badge-info-text: #b8d5be;
          --admin-badge-danger-bg: #351f1a;
          --admin-badge-danger-text: #e9a89a;
        }
      }

      /* Explicit dark choice — wins regardless of system preference. */
      :root[data-theme='dark'] {
        --admin-bg: #171914;
        --admin-surface: #1f221c;
        --admin-surface-muted: #1a1d17;
        --admin-border: #2e3228;
        --admin-border-strong: #434836;
        --admin-text: #e8e6dd;
        --admin-text-muted: #a8ada0;
        --admin-text-subtle: #72786c;
        --admin-accent: #8ab79a;
        --admin-accent-hover: #a2cfb1;
        --admin-accent-soft: #2a3a2f;
        --admin-accent-soft-text: #c7e0cd;
        --admin-shadow-sm: inset 0 0 0 1px rgba(255, 253, 240, 0.02);
        --admin-shadow-md: inset 0 0 0 1px rgba(255, 253, 240, 0.03), 0 1px 2px rgba(0, 0, 0, 0.3);

        --admin-badge-default-bg: #24281f;
        --admin-badge-default-text: #b5baa9;
        --admin-badge-success-bg: #2a3a2f;
        --admin-badge-success-text: #c7e0cd;
        --admin-badge-warning-bg: #2f281a;
        --admin-badge-warning-text: #d5b982;
        --admin-badge-info-bg: #233028;
        --admin-badge-info-text: #b8d5be;
        --admin-badge-danger-bg: #351f1a;
        --admin-badge-danger-text: #e9a89a;
      }

      /* Per-app baseline styles (universal reset, body font, body background)
         live in the app's layout component (HNLayout.svelte, AdminLayout.svelte,
         TodoWrapper.svelte) so each page can opt in to its own normalization.
         The shell only ships inert tokens above so a page like /todo can render
         under Tailwind without inheriting any global resets. */

      .gh-corner {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 9999;
        border: 0;
        color: #fff;
      }
      .gh-corner svg {
        fill: #151513;
        color: #fff;
      }
      .gh-corner .octo-arm {
        transform-origin: 130px 106px;
      }
      .gh-corner:hover .octo-arm {
        animation: octocat-wave 560ms ease-in-out;
      }
      @keyframes octocat-wave {
        0%,
        100% {
          transform: rotate(0);
        }
        20%,
        60% {
          transform: rotate(-25deg);
        }
        40%,
        80% {
          transform: rotate(10deg);
        }
      }
      @media (max-width: 500px) {
        .gh-corner:hover .octo-arm {
          animation: none;
        }
        .gh-corner .octo-arm {
          animation: octocat-wave 560ms ease-in-out;
        }
      }
    </style>
    {{mochi.css}}
  </head>
  <body>
    {{mochi.body}}
    <a href="https://github.com/khromov/mochi" target="_blank" rel="noopener noreferrer" class="gh-corner" aria-label="View source on GitHub">
      <svg width="80" height="80" viewBox="0 0 250 250" aria-hidden="true">
        <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
        <path
          d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.9,78.5 120.9,78.5 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2"
          fill="currentColor"
          class="octo-arm"
        ></path>
        <path
          d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.8 141.5,141.9 141.8,141.8 Z"
          fill="currentColor"
          class="octo-body"
        ></path>
      </svg>
    </a>
    {{mochi.script}}
  </body>
</html>
