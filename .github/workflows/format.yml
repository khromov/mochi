name: format

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel superseded runs for the same PR/branch so a new push doesn't leave the
# old run churning (or hanging) on stale code.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      # Persist the Prettier cache across runs. Uses --cache-strategy content
      # (set in the format script) because checkout rewrites mtimes every run,
      # which would invalidate the default metadata-based cache entirely.
      - name: Cache Prettier results
        uses: actions/cache@v6
        with:
          path: .cache/prettier
          key: ${{ runner.os }}-prettiercache-${{ hashFiles('.prettierrc*', 'package.json', 'bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-prettiercache-${{ hashFiles('.prettierrc*', 'package.json', 'bun.lock') }}-
            ${{ runner.os }}-prettiercache-

      - name: Format check
        run: bun run format:check
