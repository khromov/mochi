name: build + publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

# max-parallel below only orders legs *within* one run, so two merges landing
# back-to-back would otherwise deploy on top of each other. This queues whole
# runs per branch instead: run 2 stays pending until run 1 is completely done.
# It also keeps the :main tag honest — nothing can overwrite the image between
# run 1's push and run 1's deploy, because run 2 hasn't started building yet.
#
# cancel-in-progress: false is the entire point; don't flip it. Note that only
# one run can sit pending per group, so a third merge arriving while run 2 is
# still queued cancels run 2 — the newest commit supersedes it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Main demo site. Deployed in dev mode (shared root Dockerfile,
          # workspace selected via the WORKSPACE build arg) so the debug
          # toolbar and dev overlays are visible. Prebuilt prod variants
          # live at Dockerfile.production / packages/demos/Dockerfile.production.
          - name: site
            workspace: site
            dockerfile: Dockerfile
            port: 3333
            image: ghcr.io/khromov/mochi
            caprover_app: mochi
            caprover_token_secret: APP_TOKEN_S1
            bun_image: oven/bun:1.4.2-alpine
          # Standalone demos site, also deployed in dev mode. Requires repo
          # secret APP_TOKEN_DEMOS — the per-app deploy token from the
          # mochi-demos CapRover app's "Deployment" tab.
          - name: demos
            workspace: demos
            dockerfile: Dockerfile
            port: 3334
            image: ghcr.io/khromov/mochi-demos
            caprover_app: mochi-demos
            caprover_token_secret: APP_TOKEN_DEMOS_S1
            bun_image: oven/bun:1.4.2-alpine
          # Support form (support.mochi.fast). The only leg on the prebuilt
          # Dockerfile.production rather than the dev-mode Dockerfile — a contact
          # form wants no debug toolbar, and it needs no live docs rendering.
          # Requires repo secret APP_TOKEN_SUPPORT (per-app deploy token from the
          # mochi-support CapRover app's "Deployment" tab) plus ADMIN_PASSWORD
          # and the SMTP_* env vars on the app itself; see
          # packages/support/.env.example.
          - name: support
            workspace: support
            dockerfile: Dockerfile.production
            port: 3336
            image: ghcr.io/khromov/mochi-support
            caprover_app: mochi-support
            caprover_token_secret: APP_TOKEN_SUPPORT_S1
            bun_image: oven/bun:1.4.2-alpine
            # Dockerfile.production refuses to boot without ADMIN_PASSWORD +
            # SMTP_HOST + MOCHI_ORIGIN; the transport only connects on send and
            # /admin/ is never hit here, so dummy values suffice for a boot
            # smoke test.
            smoke_env: >-
              -e ADMIN_PASSWORD=smoke
              -e SMTP_HOST=smtp.invalid
              -e SMTP_USER=smoke
              -e SMTP_PASSWORD=smoke
              -e MOCHI_ORIGIN=https://support.mochi.fast

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build locally (no push) so the image can be smoke-tested before it
      # ever reaches the registry — a broken :main tag must not exist, even
      # un-deployed, since Swarm re-pulls it on task restarts.
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PUBLIC_DISABLE_OPFS=false
            WORKSPACE=${{ matrix.workspace }}
            PORT=${{ matrix.port }}
            BUN_IMAGE=${{ matrix.bun_image }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Boot the freshly built container and verify it actually serves before
      # pushing/deploying: /health answers, and the island JS referenced by
      # the served HTML resolves on the same server (guards the class of
      # incident where stale/mismatched bundle hashes 404 in production).
      #
      # Every failure path must turn the job RED. The earlier version piped
      # `curl "$BASE/"` straight into grep with `|| true`, so a reset/5xx on /
      # collapsed to an empty match and was silently treated as "page has no
      # island asset — skip", passing green. Here `GET /` is checked on its own
      # and fails hard, and transient resets are absorbed by curl's own --retry
      # rather than swallowed.
      - name: Smoke test image
        run: |
          set -uo pipefail
          IMAGE="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)"
          BASE="http://127.0.0.1:${{ matrix.port }}"

          fail() {
            echo "::error::$1"
            echo "----- docker logs smoke -----"
            docker logs smoke 2>&1 || true
            docker rm -f smoke >/dev/null 2>&1 || true
            exit 1
          }
          # Absorb one-off resets/refused within a single call; a persistently
          # broken server exhausts the retries and correctly fails.
          curl_retry() { curl -fsS --retry 5 --retry-delay 1 --retry-all-errors --retry-connrefused "$@"; }

          docker run -d --name smoke ${{ matrix.smoke_env }} \
            -p "127.0.0.1:${{ matrix.port }}:${{ matrix.port }}" "$IMAGE"

          # 1) Readiness. The loop is the retry mechanism, so plain curl (no -S):
          # transient boot errors are expected and shouldn't spam the log — real
          # trouble is surfaced by docker logs on the not-ready fail() below.
          ready=""
          for _ in $(seq 1 50); do
            if curl -fs --max-time 5 -o /dev/null "$BASE/health"; then
              ready=1
              break
            fi
            [ "$(docker inspect -f '{{.State.Running}}' smoke)" = "true" ] || fail "container exited during boot"
            sleep 3
          done
          [ -n "$ready" ] || fail "/health not ready after 150s"

          # 2) GET / must succeed, and the island bundle it references must
          # resolve on the same server. Re-fetch / on each attempt so a dev-mode
          # recompile that re-hashes the bundle URL can't fail us on a stale hash.
          verified=""
          for attempt in $(seq 1 8); do
            html="$(curl_retry --max-time 15 "$BASE/")" || fail "GET / failed"
            asset="$(printf '%s' "$html" | grep -o '/_mochi/client/[A-Za-z0-9_.-]*\.js' | head -n1 || true)"
            [ -n "$asset" ] || fail "GET / returned 200 but referenced no /_mochi/client bundle (broken render/shell)"
            echo "attempt $attempt: verifying island asset $asset"
            if curl_retry --max-time 15 -o /dev/null "$BASE$asset"; then
              echo "island asset $asset resolves (200)"
              verified=1
              break
            fi
            echo "attempt $attempt: $asset did not resolve — re-fetching / and retrying"
            sleep 3
          done
          [ -n "$verified" ] || fail "HTML references an island bundle the server won't serve"

          # 3) The image's own HEALTHCHECK must converge. Curling /health ourselves
          # proves the route serves, not that the probe baked into the Dockerfile
          # asks for the right URL — an orchestrator would restart-loop on that.
          # A transient `unhealthy` is not fatal — with --start-period=30s --interval=30s
          # --retries=3 a slow dev-mode boot can latch it around t=120s while the readiness
          # loop above still tolerates 150s, and the next passing probe clears it.
          healthy=""
          status=""
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' smoke)"
            [ "$status" != "none" ] || fail "image declares no HEALTHCHECK"
            if [ "$status" = "healthy" ]; then
              healthy=1
              break
            fi
            sleep 5
          done
          [ -n "$healthy" ] || fail "HEALTHCHECK never reached healthy after 150s (last status: $status) — the probe's URL likely does not match what the app serves"

          docker rm -f smoke

      - name: Push Docker Image
        run: |
          printf '%s\n' "${{ steps.meta.outputs.tags }}" | xargs -n1 docker push

  # Deploys are serialized (max-parallel: 1) because the CapRover server
  # reconciles one app at a time — concurrent deploys contend for it. Builds
  # above stay fully parallel; only this job is one-at-a-time. fail-fast stays
  # off so a hiccup on one app still lets the others deploy: their images are
  # already built, smoke-tested and pushed by the time we get here.
  #
  # The matrix here only carries the deploy targets. Keep the three entries in
  # sync with the build matrix above when adding/renaming an app.
  deploy:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - name: site
            image: ghcr.io/khromov/mochi
            caprover_app: mochi
            caprover_token_secret: APP_TOKEN_S1
          - name: demos
            image: ghcr.io/khromov/mochi-demos
            caprover_app: mochi-demos
            caprover_token_secret: APP_TOKEN_DEMOS_S1
          - name: support
            image: ghcr.io/khromov/mochi-support
            caprover_app: mochi-support
            caprover_token_secret: APP_TOKEN_SUPPORT_S1

    steps:
      # caprover CLI pinned to 2.3.1: the caprover/deploy-from-github action
      # installs npm `latest` unpinned, and 2.4.0 crashes on load
      # (caprover-cli#126, duplicate `-t` short flag), so we invoke the CLI
      # directly against a known-good version instead of via the action.
      - name: Deploy on CapRover
        env:
          APP_TOKEN: ${{ secrets[matrix.caprover_token_secret] }}
        run: |
          npm i -g caprover@2.3.1
          caprover deploy \
            --caproverUrl "${{ secrets.APP_SERVER_S1 }}" \
            --appToken "$APP_TOKEN" \
            --appName "${{ matrix.caprover_app }}" \
            --imageName "${{ matrix.image }}:main"
