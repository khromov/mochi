name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to re-publish (e.g. mochi-framework-v0.1.0 or create-mochi-v0.0.2)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      mochi_release_created: ${{ steps.release.outputs['packages/mochi--release_created'] }}
      mochi_tag_name: ${{ steps.release.outputs['packages/mochi--tag_name'] }}
      cli_release_created: ${{ steps.release.outputs['packages/cli--release_created'] }}
      cli_tag_name: ${{ steps.release.outputs['packages/cli--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Check out release PR branch
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/checkout@v6
        with:
          ref: release-please--branches--main

      - name: Set up Bun
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Sync bun.lock
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: |
          bun install
          if ! git diff --quiet bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: sync bun.lock"
            git push origin release-please--branches--main
          fi

  publish-mochi:
    needs: release-please
    if: ${{ needs.release-please.outputs.mochi_release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.mochi_tag_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun run test

      - name: Publish mochi-framework to npm
        working-directory: packages/mochi
        run: npm publish --provenance --access public

  publish-cli:
    needs: release-please
    if: ${{ needs.release-please.outputs.cli_release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.cli_tag_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - run: bun install --frozen-lockfile

      - run: bun --cwd=packages/cli run typecheck
      - run: bun --cwd=packages/cli run test

      - name: Publish create-mochi to npm
        working-directory: packages/cli
        run: npm publish --provenance --access public

  republish:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - run: bun install --frozen-lockfile

      - name: Resolve package directory from tag
        id: pkg
        run: |
          tag='${{ inputs.tag }}'
          case "$tag" in
            mochi-framework-v*) echo "dir=packages/mochi" >> "$GITHUB_OUTPUT" ;;
            create-mochi-v*) echo "dir=packages/cli" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unrecognized tag: $tag (expected mochi-framework-v* or create-mochi-v*)"; exit 1 ;;
          esac

      - run: bun --cwd="${{ steps.pkg.outputs.dir }}" run typecheck
      - run: bun --cwd="${{ steps.pkg.outputs.dir }}" run test

      - name: Publish to npm
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish --provenance --access public
