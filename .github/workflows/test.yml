name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel superseded runs for the same PR/branch so a new push doesn't leave the
# old run churning (or hanging) on stale code.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# The test worker pool caps at 6 locally to keep dev machines usable; CI has the cores to spare, so use them all.
env:
  MOCHI_MAX_CONCURRENCY: max

jobs:
  test-matrix:
    runs-on: ${{ matrix.os }}
    # Fail fast on a hung step instead of burning the 6h account default (a
    # Windows Shiki-engine hang once ran for 6h before being cancelled).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Check dependency consistency
        run: bun run syncpack

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Try building server
        run: bun run build

      - name: Run tests
        run: bun run test

      # rm -rf in the clean scripts is a Bun Shell builtin, cross-platform only through `bun run`; the matrix never runs
      # clean otherwise, so this is the sole Windows coverage for it.
      - name: Verify clean scripts
        run: bun .github/scripts/verify-clean-scripts.ts

  test:
    if: always()
    needs: test-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Verify all matrix jobs passed
        if: needs.test-matrix.result != 'success'
        run: exit 1
