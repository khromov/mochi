name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel superseded runs for the same PR/branch so a new push doesn't leave the
# old run churning (or hanging) on stale code.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# The test worker pool caps at 6 locally to keep dev machines usable; CI has the cores to spare, so use them all.
env:
  MOCHI_MAX_CONCURRENCY: max

jobs:
  # TEMPORARY — delete this whole job before the PR leaves draft. It exists to answer one question with data: does
  # running the suite in parallel on Windows actually flake? Each arm is an independent sample of the same commit, with
  # `workers: 1` reproducing the old serialized behaviour as a control. Skips typecheck and lint (~2m of a Windows leg,
  # and they say nothing about test-run stability) but *not* build — `packages/site`'s build generates the gitignored
  # `lib/*.generated.ts` that `demoLlms.test.ts` needs to boot the site. Not in the `test` gate's `needs`, so a red
  # sample blocks nothing.
  windows-flake-hunt:
    name: Windows flake hunt (${{ matrix.workers }} workers, #${{ matrix.attempt }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 2, 4]
        attempt: [1, 2, 3]
    env:
      MOCHI_MAX_CONCURRENCY: ${{ matrix.workers }}
      MOCHI_TEST_REPORT_DIR: ${{ github.workspace }}/flake-hunt

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Try building server
        run: bun run build

      - name: Run tests
        run: |
          mkdir flake-hunt
          bun run test

      # `if: always()` so a failing arm still yields its per-file records — that is the sample we most want to read.
      - name: Upload per-file reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flake-hunt-${{ matrix.workers }}w-${{ matrix.attempt }}
          path: flake-hunt/
          if-no-files-found: warn

  test-matrix:
    runs-on: ${{ matrix.os }}
    # Fail fast on a hung step instead of burning the 6h account default (a
    # Windows Shiki-engine hang once ran for 6h before being cancelled).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Check dependency consistency
        run: bun run syncpack

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Try building server
        run: bun run build

      - name: Run tests
        run: bun run test

  # TEMPORARY living check: install the pinned Bun, then upgrade to the latest canary
  # and run the full suite on all three OSes. Fetches the moving canary every run by
  # design (early warning for Bun 1.4.0). Non-blocking — kept out of the `test` gate's
  # needs and marked continue-on-error, so a canary-side regression never blocks a PR.
  # Remove once we pin 1.4.0 (or drop the 1.4.0 prep).
  test-matrix-canary:
    name: Test (Bun canary)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Upgrade to the latest Bun canary
        run: |
          bun upgrade --canary
          bun --version
          bun --revision

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-canary-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-canary-

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Try building server
        run: bun run build

      - name: Run tests
        run: bun run test

  test:
    if: always()
    needs: test-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Verify all matrix jobs passed
        if: needs.test-matrix.result != 'success'
        run: exit 1
