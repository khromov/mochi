name: site health

on:
  schedule:
    - cron: '0 6 * * *' # daily, offset from the 08:00 cli regression job
  workflow_dispatch:
    inputs:
      base:
        description: 'Origin to check'
        required: false
        default: 'https://mochi.fast'

permissions:
  contents: read

jobs:
  site-health:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable

      - name: Check every sitemap page
        env:
          # Bun.WebView reads BUN_CHROME_PATH, not CHROME_PATH.
          BUN_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          BASE: ${{ inputs.base || 'https://mochi.fast' }}
        run: bun run check-site "$BASE"

      - name: Write report to Job Summary
        if: always()
        run: |
          if [ -f REPORT.md ]; then
            cat REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report file found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-health-report
          path: REPORT.md
          retention-days: 30
          if-no-files-found: warn
