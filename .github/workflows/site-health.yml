name: site health

on:
  schedule:
    - cron: '0 6 * * *' # daily, offset from the 08:00 cli regression job
  workflow_dispatch:
    inputs:
      base:
        description: 'Origin to check'
        required: false
        default: 'https://mochi.fast'

permissions:
  contents: read

jobs:
  site-health:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Check every sitemap page
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          BASE: ${{ inputs.base || 'https://mochi.fast' }}
        run: bun run check-site "$BASE"

      - name: Write report to Job Summary
        if: always()
        run: |
          if [ -f REPORT.md ]; then
            cat REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report file found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site-health-report
          path: REPORT.md
          retention-days: 30
          if-no-files-found: warn
