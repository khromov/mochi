name: Review

on:
  pull_request:
    branches: [main]

# Cancel superseded runs for the same PR/branch so a new push doesn't leave the
# old run churning (or hanging) on stale code.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  loc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Count LOC on PR branch
        run: bun .github/scripts/loc-report.ts --json > pr.json

      - name: Count LOC on main
        run: |
          git fetch origin main:refs/remotes/origin/main
          git worktree add ../main-tree origin/main
          (cd ../main-tree && bun .github/scripts/loc-report.ts --json) > main.json
          git worktree remove --force ../main-tree

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency report
        run: bun packages/mochi/scripts/dep-report.ts > dep-report.txt

      # Advisory only, folded into the review comment: `bun audit` exits non-zero whenever anything is outstanding, and
      # a PR must not go red for a vulnerability it did not introduce. `|| true` keeps the step green; a reviewer reads
      # the comment and runs `bun audit fix` deliberately.
      - name: Security advisories and licenses
        run: |
          bun audit > audit.txt 2>&1 || true
          bun pm licenses --prod > licenses.txt 2>&1 || true

      - name: Pack mochi-framework
        run: |
          cd packages/mochi
          bun pm pack
          mv mochi-framework-*.tgz ../../mochi-framework-pr.tgz

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mochi-framework-pr
          path: mochi-framework-pr.tgz
          retention-days: 30
          if-no-files-found: warn

      - name: Collect changed paths
        run: git diff --name-only origin/main...HEAD > changed.txt

      - name: Render comment
        run: bun .github/scripts/loc-comment.ts main.json pr.json --repo ${{ github.repository }} --run-id ${{ github.run_id }} --dep-report dep-report.txt --changed-paths changed.txt --audit audit.txt --licenses licenses.txt > comment.md

      - name: Post or update sticky comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            const marker = '<!-- mochi-review-bot -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
