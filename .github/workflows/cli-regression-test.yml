name: cli regression test

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  cli-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Run CLI regression test
        run: bun run cli-test

      - name: Write report to Job Summary
        if: always()
        run: |
          report=$(find cli-tests -name '*-report.md' -type f | head -1)
          if [ -n "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report file found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-regression-report
          path: cli-tests/*-report.md
          retention-days: 30
          if-no-files-found: warn
